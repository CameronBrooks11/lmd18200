name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S tests -B build/tests

      - name: Build
        run: cmake --build build/tests --parallel

      - name: Test
        run: ctest --test-dir build/tests --output-on-failure

  examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('library.json') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install -U platformio

      # Each example builds against this checkout for both Nano boards.
      - name: Build examples
        run: |
          for dir in $(find examples -name '*.ino' -exec dirname {} \; | sort); do
            echo "::group::$dir"
            pio ci "$dir" --lib=. --board=nanoatmega328new --board=nano_every
            echo "::endgroup::"
          done
